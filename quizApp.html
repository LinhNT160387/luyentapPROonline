<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thi Trắc Nghiệm & Tự Luận</title>
    <style>
        /* CSS cơ bản để giao diện nhìn gọn gàng, chuyên nghiệp */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .filter-box {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        select {
            padding: 8px;
            margin: 5px 10px 10px 0;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            min-width: 150px;
        }
        .btn-filter {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-filter:hover { background: #1d4ed8; }
    </style>
	<!-- 1. Thư viện MathLive (Bạn đã thêm ở bước trước) -->
	<script defer src="https://unpkg.com/mathlive"></script>

<!-- CẤU HÌNH BÀN PHÍM RÚT GỌN (HỖ TRỢ ĐA TAB) -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    if (window.mathVirtualKeyboard) {
        
        // Cấu hình mảng layouts chứa 2 Tab khác nhau
        window.mathVirtualKeyboard.layouts = [
            // --- TAB 1: TOÁN CƠ BẢN ---
            {
                label: "Toán Cơ Bản", 
                rows: [
                    ["7", "8", "9", "+", "-", "\\sqrt{#0}"],
                    ["4", "5", "6", "\\times", "\\div", "^{#?}"], // ^{#?} là nút tạo MŨ (chỉ số trên)
                    ["1", "2", "3", "=", "\\frac{#@}{#?}", "[backspace]"],
                    ["0", ".", "(", ")", "[left]", "[right]"]
                ]
            },
            // --- TAB 2: TẬP HỢP & HÓA/HÌNH ---
            {
                label: "Tập hợp & Hóa/Hình",
                rows: [
                    // Hàng 1: Các ký hiệu tập hợp (Thuộc, Không thuộc, Tập con, Tập rỗng, Giao, Hợp)
                    ["\\in", "\\notin", "\\subset", "\\emptyset", "\\cap", "\\cup"],
                    
                    // Hàng 2: Các tập hợp số (N, Z, R), Ký hiệu Góc, Tam giác, và nút TẠO CHỈ SỐ DƯỚI
                    ["\\mathbb{N}", "\\mathbb{Z}", "\\mathbb{R}", "\\angle", "\\Delta", "_{#?}"], 
                    
                    // Hàng 3: Thêm vài phím chữ cái in hoa hay dùng trong Hình học
                    ["A", "B", "C", "D", "S", "[backspace]"], 
                    
                    // Hàng 4: Thêm vài phím chữ cái hay dùng trong Hóa học + Mũi tên điều hướng
                    ["H", "O", "C", "N", "S", "+", "=", "[left]", "[right]"],
					// Hàng 5: Ký hiệu Hình học + Mũi tên Hóa học + Nút t độ + Chỉ số dưới
					["\\angle", "\\Delta", "\\rightarrow", "t^{\\circ}", "^{\\circ}", "_{#?}"]
                ]
            }
        ];
    }
});
</script>
	<!-- Thư viện KaTeX để hiển thị công thức ở khu vực Xem trước -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>

    <!-- 1. KHU VỰC BỘ LỌC TÌM KIẾM CÂU HỎI -->
    <div class="filter-box" id="filter-section">
        <h2 style="margin-top: 0; color: #4338ca;">🔍 Chọn bài thi</h2>
        
        <!-- Các thẻ select có thuộc tính "multiple" để chọn được nhiều cái cùng lúc (Combo) -->
        <select id="subject-filter" multiple></select>
        <select id="grade-filter" multiple></select>
        <select id="topic-filter" multiple></select>
        <select id="level-filter" multiple></select>
        
        <!-- Bộ lọc Type cần hardcode vì trong JS chưa thấy hàm tự sinh ra type -->
        <select id="type-filter" multiple>
            <option value="all" selected>Tất cả kiểu thi</option>
            <option value="mc">Trắc nghiệm</option>
            <option value="w">Tự luận</option>
        </select>
        
        <br>
        <!-- Nút này gọi trực tiếp hàm handleAdvancedFilter trong file JS của bạn -->
        <button class="btn-filter" onclick="handleAdvancedFilter()">Lọc & Tìm Câu Hỏi</button>
    </div>

    <!-- 2. KHU VỰC HIỂN THỊ CÂU HỎI VÀ ĐỒNG HỒ -->
    <!-- Mọi giao diện bài thi sẽ được JS "nhồi" vào thẻ div này -->
    <div id="quiz-container">
        <div style="background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; color: #6b7280;">
            Hãy chọn bộ lọc ở trên và bấm tìm kiếm để bắt đầu!
        </div>
    </div>

    <!-- 3. NHÚNG JAVASCRIPT (Luôn đặt ở cuối thẻ body) -->
    <script src="globals.js"></script>
    <script src="quizFunction.js"></script>
    <script src="quiz.js"></script>

</body>
</html>
