<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 20px 0;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2 style="color: #4338ca; margin-top: 0;">👋 Xin chào!</h2>
        <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">Vui lòng đăng nhập để tiếp tục</p>
        
        <!-- Form nhập giả vờ cho đẹp -->
        <input type="text" placeholder="Tên đăng nhập (Test)" value="HocSinhTest01">
        <input type="password" placeholder="Mật khẩu" value="123456">
        
        <!-- Nút chuyển thẳng sang Dashboard -->
        <button onclick="window.location.href='dashboard.html'">Đăng nhập</button>
    </div>
	<!-- Script dọn dẹp bộ nhớ ở file index.html -->
    <script>
        // 1. Xóa cấu hình của phiên đăng nhập trước (Tên, Số lượng câu)
        sessionStorage.clear();
        
        // 2. XÓA BÓNG MA THỜI GIAN của học sinh trước (nếu họ bỏ thi giữa chừng)
        // 'quiz_global_end_time' chính là chìa khóa (key) mà DualTimer dùng để lưu trữ
        localStorage.removeItem('quiz_global_end_time');
        
        console.log("Đã dọn dẹp sạch sẽ Session và Local Storage. Máy sẵn sàng cho người mới!");
    </script></body>
</html>
